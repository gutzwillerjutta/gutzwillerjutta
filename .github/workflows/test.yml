name: CI Pipeline

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('package.json', 'package-lock.json', 'npm-shrinkwrap.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json', 'package-lock.json', 'npm-shrinkwrap.json') != '' && hashFiles('package.json').contains('lint') }}
        run: npm run lint

      - name: Build or Type Check
        if: ${{ hashFiles('package.json', 'package-lock.json', 'npm-shrinkwrap.json') != '' && hashFiles('package.json').contains('build') }}
        run: npm run build

      - name: Test
        if: ${{ hashFiles('package.json', 'package-lock.json', 'npm-shrinkwrap.json') != '' && hashFiles('package.json').contains('test') }}
        run: npm test

      - name: Summary
        if: always()
        shell: bash
        run: echo "Node ${{ matrix.node-version }}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
